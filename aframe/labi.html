<html>

  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/elbobo/aframe-multisrc-component/b6d23310/dist/0.3/aframe-multisrc-component.js"></script>
  </head>

  <body>  

    <a-scene>

        <a-assets>

          <!-- TEXTURES -->
          <img id="sol" src="./images/moquette bleu.png">
          <img id="mur" src="./images/mur bois.png">
          <img id="plafond" src="./images/plafond.png">
          <img id="ciel" src="./images/ciel.png">

          <!-- MIXINS -->
          <a-mixin id="1" scale="0.06 1.57 0.45" material="src: #mur"></a-mixin>
          <a-mixin id="2" scale="0.06 1.57 0.9" material="src: #mur"></a-mixin>
          <a-mixin id="4" scale="0.06 1.57 1.8" material="src: #mur; repeat: 3.5"></a-mixin>
          <a-mixin id="r" rotation="0 90 0"></a-mixin>

        </a-assets>
        

        <!-- MURS -->
        <a-box position="-1.5 0.75 -2.225" mixin="1"></a-box>
        <a-box position="-1.725 0.75 -2.03" mixin="1 r"></a-box>
        <a-box position="-1.022 0.75 -2.225" mixin="1"></a-box> 
        <a-box position="-0.807 0.75 -2.421" mixin="1 r"></a-box>
        <a-box position="-1.273 0.75 -2.904" mixin="1 r"></a-box>
        <a-box position="-1.495 0.75 -3.326" mixin="2"></a-box>
        <a-box position="-0.615 0.75 -2.845" mixin="2"></a-box>
        <a-box position="-1.725 0.75 -3.747" mixin="1 r"></a-box>
        <a-box position="-0.81 0.75 -3.323" mixin="1 r"></a-box>
        <a-box position="-1.022 0.75 -3.518" mixin="1"></a-box>
        <a-box position="-0.381 0.75 -2.904" mixin="1 r"></a-box>
        <a-box position="-0.185 0.75 -2.672" mixin="1"></a-box>
        <a-box position="0.234 0.75 -2.421" mixin="2 r"></a-box>
        <a-box position="1.35 0.75 -3.351" mixin="1 r"></a-box>
        <a-box position="1.562 0.75 -3.337" mixin="2"></a-box>
        <a-box position="0.659 0.75 -3.793" mixin="4"></a-box>
        <a-box position="0.464 0.75 -2.904" mixin="1 r"></a-box>  
        <a-box position="0.046 0.75 -3.323" mixin="1 r"></a-box>
        <a-box position="0.893 0.75 -3.747" mixin="1 r"></a-box>
        <a-box position="0.264 0.75 -5.762" mixin="1"></a-box>
        <a-box position="1.136 0.75 -5.996" mixin="4 r"></a-box>
        <a-box position="-1.118 0.75 -5.996" mixin="4 r"></a-box>
        <a-box position="-0.248 0.75 -5.569" mixin="2"></a-box>
        <a-box position="-1.495 0.75 -5.563" mixin="2"></a-box>
        <a-box position="-1.273 0.75 -5.143" mixin="1 r"></a-box>
        <a-box position="-1.027 0.75 -4.722" mixin="2"></a-box>
        <a-box position="-1.014 0.75 -4.256" mixin="2 r"></a-box>
        <a-box position="-0.592 0.75 -4.638" mixin="4"></a-box>
        <a-box position="-0.381 0.75 -3.768" mixin="1 r"></a-box>
        <a-box position="-0.81 0.75 -5.508" mixin="1 r"></a-box>
        <a-box position="1.767 0.75 -5.508" mixin="1 r"></a-box>
        <a-box position="-1.745 0.75 -4.717" mixin="1 r"></a-box>
        <a-box position="0.008 0.75 -4.717" mixin="1 r"></a-box>
        <a-box position="-0.188 0.75 -4.246" mixin="2"></a-box>
        <a-box position="1.554 0.75 -5.313" mixin="1"></a-box>
        <a-box position="1.081 0.75 -5.119" mixin="2 r"></a-box>
        <a-box position="0.661 0.76 -5.316" mixin="1"></a-box>
        <a-box position="1.554 0.75 -4.256" mixin="2 r"></a-box>
        <a-box position="1.134 0.75 -4.473" mixin="1"></a-box>
        <a-box position="1.35 0.75 -4.667" mixin="1 r"></a-box>
        <a-box position="1.134 0.75 -5.785" mixin="1"></a-box>


        <!-- MURS CONTOURS -->
        <a-box position="0.5 0.75 -2.03" rotation="0 90 0" material="src: #mur; repeat: 5.8" scale="0.06 1.57 3"></a-box>
        <a-box position="-1.98 0.75 -4.011" material="src: #mur; repeat: 7" scale="0.06 1.57 4.022"></a-box>
        <a-box position="2 0.75 -4" material="src: #mur; repeat: 7" scale="0.06 1.57 4"></a-box>
        <a-box position="1.164 0.75 -2.707" material="src: #mur; repeat: 2.5" scale="0.06 1.57 1.35"></a-box>
        <a-box position="0.264 0.75 -3.999" material="src: #mur; repeat: 4" scale="0.06 1.57 2.25"></a-box>

        <!-- SOL / PLAFOND -->
        <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" material="src: #sol"></a-plane>
        <a-plane position="0 1.535 -4" rotation="90 0 0" width="4" height="4" material="src: #plafond; repeat: 1.4 1.4"></a-plane>

        <!-- CIEL -->
        <a-sky color="black"></a-sky>

        <!-- CAMERA -->
        <a-entity camera="active: true" look-controls wasd-controls="acceleration: 5" position="-1.251 0.858 -1.492">
          <a-entity  light="type: point; color: #f0ffad; intensity: 1; distance: 2; decay: 2" ></a-entity>
        </a-entity>

        <!-- LUMIERE AMBIANTE -->
        <a-entity light="type: ambient; color: #f0ffad; intensity: 0.01" ></a-entity>

    </a-scene>

  </body>


</html>
